name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff, mypy, codespell, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run --no-sync prek run --all-files --show-diff-on-failure
        env:
          RUFF_OUTPUT_FORMAT: github   # errors show up next to the code on the pull request

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }}, torch ${{ matrix.torch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash          # same shell on Windows
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.14"]   # oldest and newest
        torch: ["2.9", "2.15"]     # oldest we support (oldest Colab) and newest
        include:
          - { os: ubuntu-latest, python: "3.13", torch: "2.11" }   # what Colab and Kaggle run today
          - { os: windows-latest, python: "3.13", torch: "2.15" }
          - { os: macos-latest, python: "3.13", torch: "2.15" }
          - { os: ubuntu-latest, python: "3.13", torch: "none" }   # must work without torch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: uv sync --locked --no-default-groups --group test
      - name: Install PyTorch (CPU build)
        if: matrix.torch != 'none'
        env:
          TORCH: ${{ matrix.torch }}
        run: uv pip install "torch==${TORCH}.*" --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        env:
          COV: ${{ matrix.torch != 'none' && '--cov' || '' }}
        run: uv run --no-sync pytest $COV
      - name: Tests must not change files in the repo
        run: git diff --exit-code

  package:
    name: Build and try the package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Install the wheel in a clean environment and run it
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/oomless --version
